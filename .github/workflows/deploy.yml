name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main # Trigger deployment on push to main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Build React app
      - name: Build app
        run: CI=false npm run build # ignore warnings

      # 5. Deploy to GitHub Pages
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages # The branch GitHub Pages serves from
          publish_dir: ./build # React's build output folder
          force_orphan: true # Ensures gh-pages branch is replaced, avoids conflicts
